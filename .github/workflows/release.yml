name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create a release for (created on the default branch if missing)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi

          # Create a missing tag on the default branch (manual runs only)
          TARGET=""
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
              echo "Tag ${TAG} not found"
              exit 1
            fi
            TARGET="$(git rev-parse HEAD)"
            git tag "${TAG}" "${TARGET}"
          fi

          # Release notes from the changelog section of this version
          awk -v tag="${TAG}" '
            /^<a name=/ { if (found) exit }
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          fi

          # Script of this version (renamed in 1.1.0)
          git show "${TAG}:ssh-login-notification.sh" > ssh-login-notification.sh 2>/dev/null \
            || git show "${TAG}:ssh_login_notification.sh" > ssh-login-notification.sh

          if [ -n "${TARGET}" ]; then
            gh release create "${TAG}" --target "${TARGET}" --title "${TAG}" --notes-file notes.md ssh-login-notification.sh
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file notes.md ssh-login-notification.sh
          fi
